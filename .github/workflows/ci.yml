name: ci
on: [push, pull_request]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1 # the same version the gate runs locally
  web:
    # The apps/* gate from AGENTS.md: lint with zero warnings, typecheck, test, build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test # reads the saved mainnet receipts in docs/evidence/
      - run: npm run build
  contracts:
    # The contracts gate from AGENTS.md: fmt, lint with zero warnings, build with sizes, test.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.8.3 } # the version pinned in AGENTS.md
      - run: forge fmt --check
      - run: forge lint --deny warnings
      - run: forge build --sizes
      - run: forge test -vv # the mainnet fork checks are opt-in (CELO_FORK=1), so CI needs no RPC
